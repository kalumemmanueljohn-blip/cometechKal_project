<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a853"/>
      <stop offset="50%" style="stop-color:#e8c170"/>
      <stop offset="100%" style="stop-color:#f5d98a"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e17"/>
      <stop offset="100%" style="stop-color:#141b2b"/>
    </linearGradient>
  </defs>
  
  <!-- Fond -->
  <rect width="100" height="100" rx="22" fill="url(#bgGrad)"/>
  
  <!-- Bordure -->
  <rect x="3" y="3" width="94" height="94" rx="19" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.3"/>
  
  <!-- Cercle décoratif -->
  <circle cx="50" cy="50" r="32" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.15"/>
  
  <!-- Lettre C -->
  <text 
    x="50" 
    y="72" 
    font-family="'Poppins', sans-serif" 
    font-size="56" 
    font-weight="800" 
    fill="url(#goldGrad)" 
    text-anchor="middle"
    letter-spacing="-2"
  >C</text>
  
  <!-- Point décoratif -->
  <circle cx="76" cy="28" r="3" fill="url(#goldGrad)" opacity="0.4"/>
</svg>